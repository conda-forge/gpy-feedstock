schema_version: 1

context:
  name: GPy
  version: "1.15.0"
  sha256: 5f47700d7a1d6154367bad3f84c0482b8817713d94d5c128495aa9180d7349ec

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | lower }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  skip: match(python, "<3.12")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
        - cython
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - poetry-core
    - numpy
    - cython
    - setuptools
    - scipy >=0.16
    - six
  run:
    - python
    - cython
    - paramz >0.9.6
    - ${{ pin_compatible('numpy') }}
    - scipy
    - six
    - matplotlib-base

tests:
  - requirements:
      run:
        - pip
    script:
      - if: linux and match(python, ">=2,<3")
        then: export MPLBACKEND="AGG"
      - python -c "import GPy"
      - pip check

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: The Gaussian Process Toolbox
  homepage: http://github.com/SheffieldML/GPy
  repository: https://github.com/SheffieldML/GPy
  documentation: https://pythonhosted.org/GPy/

extra:
  recipe-maintainers:
    - dirmeier
    - thompsonsed
    - jan-janssen
